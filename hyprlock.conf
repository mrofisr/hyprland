# Calm Mocha Island · lock screen
# Blurred anime wallpaper, big clock, teal "type to unlock"

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/abdurrofi/.local/share/wallpapers/makkah-1.png
    blur_passes = 2
    blur_size = 3
    color = rgba(17, 17, 27, 0.30)
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    rounding = 16
    outer_color = rgb(49, 50, 68)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    check_color = rgb(148, 226, 213)
    fail_color = rgb(243, 139, 168)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##94e2d5">type to unlock</span></i>
    font_family = JetBrains Mono Nerd Font
    dots_center = true
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 96
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(148, 226, 213, 0.9)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 205
    halign = center
    valign = center
}

label {
    monitor =
    text = abdurrofi
    color = rgba(166, 173, 200, 0.7)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}
